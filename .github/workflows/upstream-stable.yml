name: Track Chromium Stable

on:
  workflow_call:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      adapter_ref:
        description: 'Adapter branch or ref to build'
        required: false
        default: 'hmos-150-adapter'
        type: string
      publish_release:
        description: 'Publish the verified HAP as a GitHub Release asset'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag (leave empty for an automatic run tag)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.upstream.outputs.version }}
      revision: ${{ steps.upstream.outputs.revision }}
      is_newer: ${{ steps.upstream.outputs.is_newer }}
      compatible: ${{ steps.adapter.outputs.compatible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.adapter_ref || github.ref_name }}
      - id: upstream
        name: Resolve official stable release
        run: scripts/resolve-latest-stable.sh
      - id: adapter
        name: Test current patch
        run: >-
          scripts/check-upstream-adapter.sh
          "${{ steps.upstream.outputs.version }}"
          "${{ steps.upstream.outputs.revision }}"
      - uses: actions/upload-artifact@v4
        with:
          name: stable-${{ steps.upstream.outputs.version }}-report
          path: upstream-compatibility.md
      - name: Open or update upstream issue
        if: steps.upstream.outputs.is_newer == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.upstream.outputs.version }}';
            const revision = '${{ steps.upstream.outputs.revision }}';
            const compatible = '${{ steps.adapter.outputs.compatible }}';
            const title = `[upstream] Chromium ${version} adapter refresh`;
            const body = [
              `Official Chromium Stable ${version} (${revision}) was detected.`,
              `Current HarmonyOS patch applies cleanly: ${compatible}.`,
              '',
              compatible === 'true'
                ? 'The licensed HarmonyOS HAP build may run when enabled.'
                : 'The patch needs a compatibility refresh before a native build can be trusted.'
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.data.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

  prepare-harmonyos-sdk:
    needs: compatibility
    if: >-
      needs.compatibility.outputs.compatible == 'true' &&
      vars.ENABLE_HARMONYOS_GITHUB_HOSTED_BUILD == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.adapter_ref || github.ref_name }}
      - name: Install SDK extraction tools
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Download and verify official OpenHarmony SDK
        env:
          HARMONYOS_SDK_URL: ${{ secrets.HARMONYOS_SDK_URL }}
          HARMONYOS_SDK_SHA256: ${{ vars.HARMONYOS_SDK_SHA256 }}
          HARMONYOS_SDK_API_VERSION: ${{ vars.HARMONYOS_SDK_API_VERSION }}
        run: scripts/download-harmonyos-sdk.sh
      - name: Download and verify official Command Line Tools
        env:
          HARMONYOS_CLT_URL: ${{ secrets.HARMONYOS_CLT_URL }}
          HARMONYOS_CLT_SHA256: ${{ vars.HARMONYOS_CLT_SHA256 }}
        run: scripts/download-harmonyos-cli.sh
      - uses: actions/upload-artifact@v4
        with:
          name: harmonyos-build-tools-${{ github.run_id }}
          path: |
            harmonyos-sdk/
            harmonyos-cli/
          compression-level: 0
          retention-days: 1

  build-hap-github:
    needs: [compatibility, prepare-harmonyos-sdk]
    permissions:
      contents: write
    if: >-
      needs.compatibility.outputs.compatible == 'true' &&
      vars.ENABLE_HARMONYOS_GITHUB_HOSTED_BUILD == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.adapter_ref || github.ref_name }}
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync unzip
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${RUNNER_TEMP}/depot_tools"
          echo "${RUNNER_TEMP}/depot_tools" >> "${GITHUB_PATH}"
      - uses: actions/download-artifact@v4
        with:
          name: harmonyos-build-tools-${{ github.run_id }}
          path: .
      - name: Prepare optional signing config
        env:
          HARMONYOS_SIGNING_CONFIG_B64: ${{ secrets.HARMONYOS_SIGNING_CONFIG_B64 }}
        run: |
          if [[ -n "${HARMONYOS_SIGNING_CONFIG_B64}" ]]; then
            printf '%s' "${HARMONYOS_SIGNING_CONFIG_B64}" | base64 --decode > "${RUNNER_TEMP}/build-profile.json5"
            echo "HARMONYOS_SIGNING_CONFIG_PATH=${RUNNER_TEMP}/build-profile.json5" >> "${GITHUB_ENV}"
          fi
      - name: Build native runtime and HAP on GitHub-hosted runner
        env:
          NINJA_JOBS: 2
        run: |
          # Artifact extraction may normalize executable bits. Restore the
          # compiler/tool and command-line-tools entry points before use.
          find harmonyos-sdk -type f \
            \( -path '*/native/llvm/bin/*' -o -path '*/native/build-tools/*' -o -path '*/toolchains/*' \) \
            -exec chmod +x {} +
          hvigor="$(cat harmonyos-cli/hvigor.relative)"
          ohpm="$(cat harmonyos-cli/ohpm.relative)"
          chmod +x "${hvigor}" "${ohpm}"
          if [[ -f harmonyos-cli/clt_root.relative ]]; then
            clt_root_rel="$(cat harmonyos-cli/clt_root.relative)"
            if [[ -f "${clt_root_rel}/tool/node/bin/node" ]]; then
              chmod +x "${clt_root_rel}/tool/node/bin/node"
            fi
          fi
          sdk_root="$(cat harmonyos-sdk/sdk_root.relative)"
          export HARMONYOS_SDK_ROOT="${GITHUB_WORKSPACE}/${sdk_root}"
          export HARMONYOS_HVIGOR="${GITHUB_WORKSPACE}/${hvigor}"
          export HARMONYOS_OHPM="${GITHUB_WORKSPACE}/${ohpm}"
          if [[ -f harmonyos-cli/clt_root.relative ]]; then
            clt_root="${GITHUB_WORKSPACE}/$(cat harmonyos-cli/clt_root.relative)"
            export PATH="${clt_root}/bin:${PATH}"
            if [[ -x "${clt_root}/tool/node/bin/node" ]]; then
              export NODE_HOME="${clt_root}/tool/node"
              export PATH="${NODE_HOME}/bin:${PATH}"
            fi
          fi
          scripts/self-hosted-build-hap.sh \
            "${{ needs.compatibility.outputs.version }}" \
            "${{ needs.compatibility.outputs.revision }}"
      - uses: actions/upload-artifact@v4
        with:
          name: chromium-hmos-${{ needs.compatibility.outputs.version }}
          path: artifacts/*.hap
          retention-days: 7
      - name: Publish HAP to GitHub Release
        if: ${{ inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.compatibility.outputs.version }}
          REVISION: ${{ needs.compatibility.outputs.revision }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${REQUESTED_TAG}"
          if [[ -z "${tag}" ]]; then
            tag="chromium-hmos-${VERSION}-${GITHUB_RUN_NUMBER}"
          fi
          gh release create "${tag}" artifacts/*.hap \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Chromium HarmonyOS ${VERSION}" \
            --notes "Chromium ${VERSION} (${REVISION}) HarmonyOS HAP build from the verified adapter workflow."

  build-hap-self-hosted:
    needs: compatibility
    if: >-
      needs.compatibility.outputs.compatible == 'true' &&
      vars.ENABLE_HARMONYOS_SELF_HOSTED_BUILD == 'true'
    runs-on: [self-hosted, harmonyos-chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.adapter_ref || github.ref_name }}
      - name: Build native runtime and HAP
        env:
          HARMONYOS_SDK_ROOT: ${{ vars.HARMONYOS_SDK_ROOT }}
          HARMONYOS_SIGNING_CONFIG_PATH: ${{ vars.HARMONYOS_SIGNING_CONFIG_PATH }}
          NINJA_JOBS: ${{ vars.NINJA_JOBS }}
        run: >-
          scripts/self-hosted-build-hap.sh
          "${{ needs.compatibility.outputs.version }}"
          "${{ needs.compatibility.outputs.revision }}"
      - uses: actions/upload-artifact@v4
        with:
          name: chromium-hmos-self-hosted-${{ needs.compatibility.outputs.version }}
          path: artifacts/*.hap
          retention-days: 7
